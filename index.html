<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087d40"><link rel="manifest" href="manifest.json"><title>DriveReady Zambia Ultimate</title><style>:root{--bg:#f3f7f5;--fg:#10271c;--card:white;--mut:#64776d;--green:#087d40}body.dark{--bg:#111c17;--fg:#f2fff7;--card:#1d3026;--mut:#b0c4b7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px system-ui}header{background:#087d40;color:white;padding:22px 16px}main{max-width:900px;margin:auto;padding:16px}.nav{display:flex;gap:8px;overflow:auto;padding:12px 0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:11px 14px;background:#e4f3e9;color:#073f23}button.primary{background:#087d40;color:white}button:focus-visible{outline:3px solid orange}.nav button{white-space:nowrap}.card{background:var(--card);padding:18px;border-radius:15px;margin:12px 0;box-shadow:0 2px 10px #0001}h1{margin:0;font-size:25px}h2{margin:8px 0 14px}small,.mut{color:var(--mut)}.opts{display:grid;gap:9px}.opts button{text-align:left;background:var(--bg);color:var(--fg);border:1px solid #8ca899}.opts button.correct{background:#b9edc9;color:#103c22}.opts button.wrong{background:#ffd2d2;color:#5d1414}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.stat{font-size:28px;font-weight:750}.hidden{display:none}input,textarea{width:100%;padding:12px;border:1px solid #8ca899;border-radius:9px;background:var(--card);color:var(--fg)}.progress{height:10px;background:#d0e5d8;border-radius:20px;overflow:hidden}.progress div{height:100%;background:#087d40}footer{text-align:center;padding:30px;color:var(--mut)}</style></head><body><header><div style="max-width:900px;margin:auto"><h1>🚘 DriveReady Zambia Ultimate</h1><div>Learn • Practise • Improve</div></div></header><main><nav class="nav" id="nav"></nav><section id="screen"></section></main><footer>Independent study aid • Not an official RTSA examination or question bank</footer><script>
const QUESTIONS=[
["What should you do at a STOP sign?",["Slow down only","Stop completely and check it is safe","Sound the horn","Accelerate"],1,"Stop fully before proceeding when safe.","Signs"],
["What does a red traffic light mean?",["Proceed carefully","Stop","Turn right","Speed up"],1,"A red light means stop.","Signals"],
["What should you do before changing lanes?",["Signal and check mirrors and blind spot","Sound horn only","Accelerate immediately","Close windows"],0,"Observe, signal and move only when safe.","Safety"],
["Why is a seat belt important?",["It improves fuel economy","It reduces injury risk","It increases speed","It replaces airbags"],1,"Seat belts help protect occupants.","Safety"],
["When approaching a pedestrian crossing, you should?",["Be ready to stop for pedestrians","Accelerate","Ignore pedestrians","Overtake"],0,"Give pedestrians the required priority.","Pedestrians"],
["What is a safe response to heavy rain?",["Increase speed","Reduce speed and increase following distance","Turn off lights","Brake sharply"],1,"Wet roads reduce grip and visibility.","Conditions"],
["What does a triangular warning sign generally indicate?",["A hazard ahead","A parking space","A hospital","A speed limit"],0,"Warning signs alert drivers to potential hazards.","Signs"],
["What should you check before starting a vehicle?",["Mirrors, seat position and surroundings","Radio volume","Phone messages","Fuel price"],0,"Prepare the vehicle and observe before moving.","Vehicle"],
["If you feel tired while driving, what should you do?",["Keep driving","Stop somewhere safe and rest","Drive faster","Open a window only"],1,"Fatigue affects attention and reaction time.","Safety"],
["When should you use indicators?",["Only at night","Before turning or changing lanes","Only on highways","Never"],1,"Indicators communicate your intentions.","Signals"],
["What should you do near a school?",["Slow down and watch for children","Sound horn continuously","Overtake quickly","Ignore road signs"],0,"Children may enter the road unexpectedly.","Pedestrians"],
["What does a solid road centre line generally mean?",["Overtaking is encouraged","Do not cross where prohibited","Parking only","Bus lane"],1,"Obey road markings and do not cross prohibited lines.","Signs"],
["What should you do if an emergency vehicle approaches with warning signals?",["Block the lane","Yield safely as required","Race it","Stop in the middle of a junction"],1,"Make way safely without creating another hazard.","Safety"],
["What is the purpose of a vehicle's mirrors?",["Decoration","Observing traffic around the vehicle","Reducing engine heat","Measuring speed"],1,"Use mirrors regularly and check blind spots.","Vehicle"],
["What should you do at a junction with poor visibility?",["Proceed without looking","Approach slowly and observe carefully","Use your phone","Overtake"],1,"Take extra care when visibility is limited.","Safety"],
["What does a circular red-bordered sign usually indicate?",["A restriction or prohibition","Tourist attraction","Fuel station","Weather"],0,"Many regulatory signs use red borders.","Signs"],
["What should you do if your vehicle begins to skid?",["Avoid sudden steering and braking","Accelerate hard","Close your eyes","Pull handbrake sharply"],0,"Stay calm and avoid abrupt inputs.","Conditions"],
["Before reversing, what should you do?",["Check all around and reverse slowly","Use mirrors only","Reverse quickly","Sound horn and ignore obstacles"],0,"Look for people and obstacles before and during reversing.","Vehicle"],

["When entering a roundabout, what should you do?",["Observe signs and give way as required","Stop permanently","Drive across the centre","Ignore other vehicles"],0,"Follow local signs, markings and priority rules.","Junctions"]
];const KEY="driveready-ultimate-webapp-v1";let data;try{data=JSON.parse(localStorage.getItem(KEY))||{attempts:[],wrong:[],notes:"",theme:"light"}}catch(e){data={attempts:[],wrong:[],notes:"",theme:"light"}};let mode="practice",items=[],pos=0,score=0,answered=false;const tabs=["Home","Practice","Mock Exam","Mistakes","Study Notes","Road Signs","Checklist"];function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}function el(s){document.getElementById("screen").innerHTML=s}function nav(){document.getElementById("nav").innerHTML=tabs.map(x=>'<button onclick="page(\''+x+'\')" class="'+(window.tab===x?'primary':'')+'">'+x+'</button>').join("")}function page(t){window.tab=t;nav();if(t==="Home"){let a=data.attempts;el('<div class="card"><h2>Your driving study dashboard</h2><div class="grid"><div><div class="stat">'+a.length+'</div>Tests completed</div><div><div class="stat">'+(a.length?Math.round(a.reduce((s,x)=>s+x.pct,0)/a.length):0)+'%</div>Average score</div><div><div class="stat">'+data.wrong.length+'</div>Questions to revise</div></div></div><div class="card"><h2>Start learning</h2><p>Take a practice quiz or a 20-question mock exam. Your scores are saved on this device.</p><button class="primary" onclick="page(\'Practice\')">Quick practice</button> <button onclick="page(\'Mock Exam\')">Mock exam</button></div><div class="card"><button onclick="document.body.classList.toggle(\'dark\');data.theme=document.body.classList.contains(\'dark\')?\'dark\':\'light\';save()">Toggle dark mode</button> <button onclick="backup()">Export progress</button> <button onclick="document.getElementById(\'restore\').click()">Import progress</button><input type="file" id="restore" accept="application/json" style="display:none" onchange="restore(this)"></div>')}else if(t==="Practice"||t==="Mock Exam"){mode=t;items=[...QUESTIONS.keys()];for(let i=items.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]]}if(t==="Practice")items=items.slice(0,10);pos=score=0;question()}else if(t==="Mistakes"){let ids=[...new Set(data.wrong)];el('<div class="card"><h2>Revise mistakes</h2><p>'+ids.length+' questions saved for review.</p>'+ids.map(i=>'<p><b>'+escapeHTML(QUESTIONS[i][0])+'</b><br>'+escapeHTML(QUESTIONS[i][3])+'</p>').join("")+'<button onclick="page(\'Practice\')">Start practice</button></div>')}else if(t==="Study Notes"){el('<div class="card"><h2>Personal study notes</h2><textarea id="notes" rows="12" placeholder="Write down lessons from your instructor..."></textarea><p><button class="primary" onclick="data.notes=document.getElementById(\'notes\').value;save();alert(\'Notes saved\')">Save notes</button></p></div>');document.getElementById("notes").value=data.notes||""}else if(t==="Road Signs"){el('<div class="card"><h2>Road signs revision</h2><p>Study common sign categories, then test yourself.</p><div class="grid"><div class="card"><h3>🛑 STOP</h3>Come to a complete stop</div><div class="card"><h3>⚠️ Warning</h3>Watch for hazards ahead</div><div class="card"><h3>🚫 Prohibition</h3>Obey restrictions</div><div class="card"><h3>🚸 Pedestrian crossing</h3>Watch for pedestrians</div></div><button class="primary" onclick="page(\'Practice\')">Quiz me</button></div>')}else{el('<div class="card"><h2>Pre-drive safety checklist</h2>'+["Adjust seat and head restraint","Fasten seat belt","Check mirrors","Check tyres and lights","Confirm handbrake and gear position","Check surroundings and blind spots","Signal before moving off"].map((x,i)=>'<p><label><input type="checkbox" style="width:auto" id="c'+i+'"> '+x+'</label></p>').join("")+'</div>')}}function question(){if(pos>=items.length){let pct=Math.round(score/items.length*100);data.attempts.push({date:new Date().toISOString(),mode,pct});save();el('<div class="card"><h2>Finished!</h2><div class="stat">'+score+' / '+items.length+' ('+pct+'%)</div><p>Review your mistakes and try again.</p><button class="primary" onclick="page(\''+mode+'\')">Try again</button> <button onclick="page(\'Mistakes\')">Review mistakes</button></div>');return}answered=false;let q=QUESTIONS[items[pos]];el('<div class="card"><small>'+mode+' • Question '+(pos+1)+' of '+items.length+'</small><div class="progress"><div style="width:'+(100*pos/items.length)+'%"></div></div><h2>'+escapeHTML(q[0])+'</h2><div class="opts" id="opts">'+q[1].map((x,i)=>'<button onclick="answer('+i+')">'+String.fromCharCode(65+i)+'. '+escapeHTML(x)+'</button>').join("")+'</div><div id="feedback"></div><p><button id="next" class="primary hidden" onclick="pos++;question()">Next question →</button></p></div>')}function answer(i){if(answered)return;answered=true;let q=QUESTIONS[items[pos]],ok=i===q[2];if(ok)score++;else if(!data.wrong.includes(items[pos]))data.wrong.push(items[pos]);if(ok)data.wrong=data.wrong.filter(x=>x!==items[pos]);save();[...document.querySelectorAll("#opts button")].forEach((b,j)=>{b.disabled=true;if(j===q[2])b.classList.add("correct");else if(j===i)b.classList.add("wrong")});document.getElementById("feedback").innerHTML='<p><b>'+(ok?'Correct!':'Not quite.')+'</b> '+escapeHTML(q[3])+'</p>';document.getElementById("next").classList.remove("hidden")}function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function backup(){let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="driveready-progress.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}function restore(input){let f=input.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let d=JSON.parse(reader.result);if(!Array.isArray(d.attempts)||!Array.isArray(d.wrong))throw Error();data=d;save();page("Home");alert("Progress restored")}catch(e){alert("Invalid backup file")}};reader.readAsText(f)}if(data.theme==="dark")document.body.classList.add("dark");page("Home");if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
