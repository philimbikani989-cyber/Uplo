<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#126e4a"><title>DriveReady Zambia — Personal Study</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#18312a;background:#f4f8f5}*{box-sizing:border-box}body{margin:0}header{background:#126e4a;color:white;padding:24px 16px}header h1{margin:0;font-size:1.55rem}header p{opacity:.9;margin:8px 0 0}main{max-width:850px;margin:auto;padding:16px}nav{display:flex;gap:8px;overflow:auto;padding:12px 0}button{font:inherit;cursor:pointer;border:1px solid #b8cfc3;background:white;border-radius:10px;padding:11px 14px;color:#14573d}button.primary,button.active{background:#126e4a;color:white;border-color:#126e4a}button:disabled{opacity:.5;cursor:default}.card{background:white;border:1px solid #dce8df;border-radius:16px;padding:20px;margin:12px 0;box-shadow:0 4px 18px #1a5c3710}.muted{color:#64776b}.choices{display:grid;gap:10px}.choices button{text-align:left}.correct{background:#e0f7e8!important;border-color:#1d9b50!important}.wrong{background:#ffe9e7!important;border-color:#c13d35!important}progress{width:100%;height:14px;accent-color:#126e4a}.tag{display:inline-block;background:#e5f4e9;color:#155b3b;border-radius:30px;padding:4px 10px;font-size:.8rem}.sign{display:grid;place-items:center;font-size:4rem;min-height:110px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.grid .card{margin:0}.big{font-size:2rem;font-weight:800}input{padding:12px;border:1px solid #b8cfc3;border-radius:10px;width:100%;font:inherit}footer{text-align:center;color:#65756a;font-size:.82rem;padding:30px 16px}@media(prefers-color-scheme:dark){:root{background:#101d18;color:#e5f5eb}.card{background:#1b2c23;border-color:#365545}.muted,footer{color:#b4c9bb}button,input{background:#22392b;color:#f0fff4;border-color:#55705f}.tag{background:#264e36;color:#b5f2c9}}</style></head><body><header><main style="padding:0"><h1>🚘 DriveReady Zambia</h1><p>Personal driving-theory practice • Offline-friendly after saving this page</p></main></header><main><nav id="nav"></nav><section id="view"></section></main><footer>Independent personal learning resource — not affiliated with RTSA. Check current official guidance before your exam.</footer><script>
const Q=[
["What should you do before moving off?","Check mirrors, blind spots, signal when needed, and ensure it is safe.",["Accelerate immediately","Check mirrors, blind spots, signal when needed, and ensure it is safe.","Sound the horn continuously","Only look ahead"],"Preparation"],
["What does a red traffic light mean?","Stop at the stop line.",["Proceed carefully","Stop at the stop line.","Give way only to trucks","Speed up"],"Signals"],
["What should you do when approaching a pedestrian crossing with people crossing?","Stop and let pedestrians cross safely.",["Sound the horn","Overtake stopped traffic","Stop and let pedestrians cross safely.","Accelerate"],"Pedestrians"],
["What is a blind spot?","An area not visible in the mirrors.",["The rear window","An area not visible in the mirrors.","A broken mirror","A lane marking"],"Observation"],
["When is it safe to overtake?","Only when permitted, visibility is clear, and there is sufficient space.",["On a blind bend","At any junction","Only when permitted, visibility is clear, and there is sufficient space.","Whenever you are late"],"Overtaking"],
["What should you do if an emergency vehicle approaches with lights and siren?","Make way safely without creating danger.",["Stop suddenly anywhere","Race ahead","Make way safely without creating danger.","Ignore it"],"Awareness"],
["Why should you increase following distance in rain?","Road grip and visibility can be reduced.",["The engine gets hotter","Road grip and visibility can be reduced.","Traffic lights change faster","The speedometer is less accurate"],"Weather"],
["What is the safest response when you feel sleepy while driving?","Stop somewhere safe and rest.",["Open a window and continue indefinitely","Drive faster","Stop somewhere safe and rest.","Turn music louder"],"Fitness"],
["What should you do before changing lanes?","Check mirrors, blind spot, signal as needed, and move only when safe.",["Move first, signal later","Check mirrors, blind spot, signal as needed, and move only when safe.","Only check the rear-view mirror","Brake sharply"],"Observation"],
["What is the main purpose of a seat belt?","Reduce injury risk in a collision.",["Improve fuel economy","Reduce injury risk in a collision.","Make the car faster","Replace airbags"],"Safety"],
["At an uncontrolled junction, what should you do?","Slow down, observe carefully, and follow applicable priority rules.",["Assume you have priority","Slow down, observe carefully, and follow applicable priority rules.","Always accelerate","Ignore pedestrians"],"Junctions"],
["What does a STOP sign require?","Come to a complete stop and proceed only when safe.",["Slow slightly","Come to a complete stop and proceed only when safe.","Only stop at night","Honk and go"],"Signs"],
["Why check tyres before a trip?","To identify damage, wear, and incorrect inflation.",["To warm the engine","To identify damage, wear, and incorrect inflation.","To reset the odometer","To improve the radio"],"Vehicle checks"],
["What should you do if visibility becomes very poor?","Reduce speed and use appropriate lights.",["Use high beam at all times","Reduce speed and use appropriate lights.","Drive close to the vehicle ahead","Switch off lights"],"Weather"],
["Why use mirrors regularly?","To maintain awareness of traffic around you.",["Only for reversing","To maintain awareness of traffic around you.","To check passengers","Only at junctions"],"Observation"],
["What is defensive driving?","Anticipating hazards and leaving room to react.",["Driving aggressively","Anticipating hazards and leaving room to react.","Always driving below 10 km/h","Never using indicators"],"Safety"],
["When approaching a roundabout, what should you do?","Slow down, read signs and markings, and yield as required.",["Enter without looking","Slow down, read signs and markings, and yield as required.","Stop in the middle","Change lanes suddenly"],"Junctions"],
["Why must you secure loose items in a vehicle?","They can move or become dangerous during braking or a collision.",["They reduce engine power","They can move or become dangerous during braking or a collision.","They affect road signs","They use more fuel"],"Safety"],
["What should you do after a practice-test mistake?","Review the explanation and practise the topic again.",["Ignore it","Memorise a letter only","Review the explanation and practise the topic again.","Stop studying"],"Study"]];
const SIGNS=[["🛑","STOP","Come to a complete stop; proceed only when safe."],["⛔","No entry","Do not enter from this direction."],["🚸","Children crossing","Watch for children and reduce speed."],["🚶","Pedestrian crossing","Be ready to yield to pedestrians."],["🚦","Traffic signals","Follow traffic lights and road markings."],["↩️","Bend ahead","Slow down and assess the curve."],["🚧","Roadworks","Look for temporary instructions and workers."],["↔️","Two-way traffic","Expect traffic moving in both directions."],["🅿️","Parking","Parking may be allowed subject to local restrictions."],["⚠️","General warning","Watch for a hazard described by accompanying signs."]];
let history=JSON.parse(localStorage.getItem("driveready_history")||"[]"),wrong=JSON.parse(localStorage.getItem("driveready_wrong")||"[]"),page="home",test=[],index=0,score=0,answered=false;const el=document.getElementById("view"),nav=document.getElementById("nav");function save(){localStorage.setItem("driveready_history",JSON.stringify(history));localStorage.setItem("driveready_wrong",JSON.stringify(wrong))}function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function setPage(p){page=p;render()}function render(){const tabs=[["home","🏠 Home"],["learn","📖 Study"],["quiz","📝 Practice"],["signs","🚦 Signs"],["stats","📊 Progress"]];nav.innerHTML=tabs.map(([p,t])=>'<button class="'+(page===p?'active':'')+'" onclick="setPage(\''+p+'\')">'+t+'</button>').join("");if(page==="home")el.innerHTML='<div class="card"><span class="tag">PERSONAL STUDY EDITION</span><h2>Get ready for the road</h2><p>Study the essentials, practise questions, learn common road signs, and keep track of your progress on this device.</p><button class="primary" onclick="startTest(false)">Start practice</button> <button onclick="setPage(\'learn\')">Study topics</button></div><div class="grid"><div class="card"><div class="big">'+Q.length+'</div>Practice questions</div><div class="card"><div class="big">'+SIGNS.length+'</div>Illustrative signs</div><div class="card"><div class="big">'+history.length+'</div>Completed tests</div></div>';if(page==="learn")el.innerHTML='<div class="card"><h2>Study Academy</h2><p class="muted">Suggested seven-day learning route</p>'+["Vehicle checks and cockpit drill","Traffic signs and signals","Observation and safe manoeuvres","Junctions and roundabouts","Pedestrians and vulnerable road users","Weather, hazards and defensive driving","Full revision and practice test"].map((x,i)=>'<p><span class="tag">Day '+(i+1)+'</span> '+x+'</p>').join('')+'</div><div class="card"><h3>Essential reminders</h3><p>Before moving off: seat, seat belt, mirrors, controls, surroundings and blind spots.</p><p>Maintain a safe following distance, especially in poor weather.</p><p>Use signals clearly, but never assume a signal gives you priority.</p><p>Obey current posted speed limits and all applicable road signs.</p></div>';if(page==="quiz")el.innerHTML='<div class="card"><h2>Practice questions</h2><p>Choose a mode. Questions are original educational examples, not official RTSA examination questions.</p><button class="primary" onclick="startTest(false)">All questions</button> <button onclick="startTest(true)" '+(!wrong.length?'disabled':'')+'>Review mistakes ('+wrong.length+')</button></div>';if(page==="signs")el.innerHTML='<h2>Road sign study</h2><p class="muted">Illustrative symbols; learn actual sign shapes and colours from official references.</p><div class="grid">'+SIGNS.map(s=>'<div class="card"><div class="sign">'+s[0]+'</div><h3>'+s[1]+'</h3><p>'+s[2]+'</p></div>').join('')+'</div>';if(page==="stats")el.innerHTML='<div class="card"><h2>Your progress</h2><p>Completed tests: <strong>'+history.length+'</strong></p><p>Best result: <strong>'+(history.length?Math.max(...history.map(x=>x.percent))+'%':'—')+'</strong></p><p>Questions to review: <strong>'+wrong.length+'</strong></p><button onclick="exportData()">Export progress</button> <button onclick="if(confirm(\'Clear all local study progress?\')){history=[];wrong=[];save();render()}">Reset</button></div>'+history.slice(-10).reverse().map(h=>'<div class="card">'+escapeHTML(h.date)+' — '+h.correct+'/'+h.total+' ('+h.percent+'%)</div>').join('')}function startTest(mistakes){test=(mistakes?wrong.slice():Q.map((_,i)=>i)).sort(()=>Math.random()-.5);index=0;score=0;showQuestion()}function showQuestion(){if(index>=test.length){const pct=Math.round(score/test.length*100);history.push({date:new Date().toLocaleString(),correct:score,total:test.length,percent:pct});save();page="quiz";render();el.innerHTML='<div class="card"><h2>Practice complete 🎉</h2><div class="big">'+score+' / '+test.length+'</div><p>'+pct+'% correct</p><button class="primary" onclick="startTest(false)">Try again</button> <button onclick="setPage(\'stats\')">View progress</button></div>';return}answered=false;const q=Q[test[index]];el.innerHTML='<div class="card"><span class="tag">'+q[3]+'</span><p class="muted">Question '+(index+1)+' of '+test.length+'</p><progress value="'+index+'" max="'+test.length+'"></progress><h2>'+escapeHTML(q[0])+'</h2><div class="choices">'+q[2].map((c,i)=>'<button id="choice'+i+'" onclick="choose('+i+')">'+escapeHTML(c)+'</button>').join('')+'</div><div id="feedback"></div></div>'}function choose(i){if(answered)return;answered=true;const q=Q[test[index]],ok=q[2][i]===q[1];if(ok){score++;wrong=wrong.filter(n=>n!==test[index])}else if(!wrong.includes(test[index]))wrong.push(test[index]);save();q[2].forEach((c,j)=>{const b=document.getElementById("choice"+j);b.disabled=true;if(c===q[1])b.classList.add("correct");else if(j===i)b.classList.add("wrong")});document.getElementById("feedback").innerHTML='<p><strong>'+(ok?'Correct!':'Not quite.')+'</strong> '+escapeHTML(q[1])+'</p><button class="primary" onclick="index++;showQuestion()">Next →</button>'}function exportData(){const b=new Blob([JSON.stringify({history,wrong},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="driveready-progress.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}render();
</script></body></html>
