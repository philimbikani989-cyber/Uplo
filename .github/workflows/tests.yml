name: Test Uploader Ultra Plus
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run tests
        env:
          UUP_ADMIN_KEY: test-key-with-more-than-twenty-four-characters
          UUP_ENABLE_LIVE: 'false'
        run: python -m pytest -q
